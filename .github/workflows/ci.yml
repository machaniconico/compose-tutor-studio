# The stable "test" aggregate job is the required status check used by auto-merge.
name: CI

on:
  merge_group:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  web:
    name: web
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.13.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit JavaScript dependencies
        run: pnpm audit --audit-level high

      - name: Typecheck
        run: pnpm typecheck

      - name: Run unit and integration tests
        run: pnpm test

      - name: Build web production bundle
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm --dir apps/studio exec playwright install --with-deps chromium

      - name: Run browser release gate
        run: pnpm e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            apps/studio/playwright-report/
            apps/studio/test-results/
          if-no-files-found: ignore
          retention-days: 14

  desktop:
    name: desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundle: appimage
          - os: macos-15
            bundle: app
          - os: windows-2025
            bundle: nsis
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Audit Rust dependencies
        if: ${{ runner.os == 'Linux' }}
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: apps/desktop/src-tauri

      - name: Install Linux desktop dependencies
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            file \
            libayatana-appindicator3-dev \
            libfuse2 \
            libgtk-3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf \
            xvfb \
            xdg-utils

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.13.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: ./apps/desktop/src-tauri -> target
          cache-on-failure: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck native test harness
        run: pnpm desktop:typecheck:native

      - name: Test desktop size gate
        run: pnpm desktop:test:size

      - name: Test release security policy
        run: pnpm desktop:test:release-policy

      - name: Lint Rust
        run: pnpm desktop:lint

      - name: Test Rust
        run: pnpm desktop:test

      - name: Run native WebView smoke on Linux
        if: ${{ runner.os == 'Linux' }}
        run: xvfb-run -a pnpm desktop:e2e:native

      - name: Run native WebView smoke
        if: ${{ runner.os != 'Linux' }}
        run: pnpm desktop:e2e:native

      - name: Build unsigned production desktop bundle
        run: pnpm --dir apps/desktop exec tauri build --ci --no-sign --bundles ${{ matrix.bundle }}

      - name: Verify platform renderer security boundary
        run: node apps/desktop/scripts/release-preflight.mjs renderer-assets --input apps/studio/dist --profile production

      - name: Enforce production executable size budget
        run: pnpm desktop:size:check

      - name: Upload native test artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-test-${{ matrix.os }}
          path: apps/desktop/test-results/
          if-no-files-found: ignore
          retention-days: 14

  test:
    name: test
    if: ${{ always() }}
    needs: [web, desktop]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify required gates
        env:
          WEB_RESULT: ${{ needs.web.result }}
          DESKTOP_RESULT: ${{ needs.desktop.result }}
        run: |
          if [ "$WEB_RESULT" != "success" ] || [ "$DESKTOP_RESULT" != "success" ]; then
            echo "Required gate failed: web=$WEB_RESULT desktop=$DESKTOP_RESULT"
            exit 1
          fi
